# Uzhavar Connect - Production Nginx Configuration
# Deploy to Ubuntu Nginx: /etc/nginx/sites-available/uzhavarconnect.conf
# Enable: sudo ln -sf /etc/nginx/sites-available/uzhavarconnect.conf /etc/nginx/sites-enabled/
# Reload: sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name uzhavarconnect.com www.uzhavarconnect.com;

    # Enforce HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name uzhavarconnect.com www.uzhavarconnect.com;

    root /var/www/uzhavarconnect/dist;
    index index.html;

    # SSL Certificates (managed by certbot / Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/uzhavarconnect.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/uzhavarconnect.com/privkey.pem;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # 1. Static Assets with 1-Year Immutable Caching
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, no-transform, immutable";
    }

    # 2. Known Root Static Files (robots, sitemap, manifest, icons, llms)
    location ~* \.(ico|jpg|jpeg|png|webp|svg|xml|txt|webmanifest|json)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # 3. 301 Permanent Redirects for Legacy / Alias URLs
    location = /join { return 301 /contact; }
    location = /construction { return 301 /services/farm-house; }
    location = /book-team { return 301 /contact; }
    location = /manage-farm { return 301 /services/end-to-end-farm-management; }
    location = /farm-details { return 301 /services/farm-layout-and-planning; }
    location = /buy-inputs { return 301 /services; }
    location = /sell-produce { return 301 /services/buyback-assistance; }
    location ~ ^/blog { return 301 /; }

    # 4. Known Valid SPA Routes -> Serve index.html with HTTP 200 OK
    location = / {
        try_files /index.html =404;
    }

    location ~ ^/(about|services|gallery|contact|book-a-service|privacy-policy|terms-and-conditions|sitemap)/?$ {
        try_files /index.html =404;
    }

    location ~ ^/services/[a-zA-Z0-9_-]+/?$ {
        try_files /index.html =404;
    }

    # 5. Invalid / Unknown URLs -> Return HTTP 404 Not Found with custom 404 page
    location / {
        return 404;
    }

    # Custom 404 Error Page Handler
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
