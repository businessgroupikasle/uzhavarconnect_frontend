<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
    <defs>
      <linearGradient id="grad_Service" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="hsl(205, 65%, 22%)"/>
        <stop offset="60%" stop-color="hsl(205, 60%, 35%)"/>
        <stop offset="100%" stop-color="hsl(205, 55%, 15%)"/>
      </linearGradient>
      <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
        <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
      </pattern>
    </defs>
    <rect width="800" height="500" fill="url(#grad_Service)"/>
    <rect width="800" height="500" fill="url(#grid)"/>

    <!-- Decorative nature circles -->
    <circle cx="700" cy="100" r="140" fill="rgba(255,255,255,0.05)"/>
    <circle cx="100" cy="420" r="180" fill="rgba(255,255,255,0.03)"/>

    <!-- Top Badge -->
    <rect x="50" y="50" width="160" height="32" rx="16" fill="rgba(255,255,255,0.15)" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
    <text x="130" y="71" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="12" fill="#86efac" text-anchor="middle" letter-spacing="1.5">SERVICE</text>

    <!-- Main Typography -->
    <text x="50" y="240" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="34" fill="#FFFFFF">Water Tank Works</text>
    <text x="50" y="285" font-family="'Inter', sans-serif" font-weight="400" font-size="18" fill="#dcfce7">Pond liners, RCC tanks, sump & rainwater harvesting</text>

    <!-- Agricultural accent line -->
    <line x1="50" y1="320" x2="250" y2="320" stroke="#facc15" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Watermark Brand -->
    <text x="750" y="460" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="16" fill="rgba(255,255,255,0.25)" text-anchor="end">UZHAVAR CONNECT</text>
  </svg>