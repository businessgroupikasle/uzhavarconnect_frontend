<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page Not Found - Uzhavar Connect</title>
    <link rel="icon" type="image/jpeg" href="/assets/favicon.jpeg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: 'Poppins', sans-serif;
        background-color: #F8FAF7;
        color: #0e3922;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 20px;
        text-align: center;
      }
      .card {
        background: #ffffff;
        max-width: 480px;
        width: 100%;
        padding: 40px 30px;
        border-radius: 24px;
        box-shadow: 0 10px 30px rgba(14, 56, 33, 0.08);
        border: 1px solid #e2e8f0;
      }
      .logo {
        height: 64px;
        width: auto;
        margin-bottom: 20px;
      }
      .badge {
        display: inline-block;
        font-size: 12px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 1px;
        color: #15803d;
        background: #dcfce7;
        padding: 4px 12px;
        border-radius: 50px;
        margin-bottom: 12px;
      }
      h1 { font-size: 28px; font-weight: 800; margin-bottom: 10px; color: #0e3922; }
      p { font-size: 15px; color: #475569; line-height: 1.6; margin-bottom: 24px; }
      .btn {
        display: inline-block;
        background: #15803d;
        color: #ffffff;
        text-decoration: none;
        padding: 12px 28px;
        border-radius: 50px;
        font-weight: 600;
        font-size: 15px;
        transition: background 0.2s;
      }
      .btn:hover { background: #166534; }
    </style>
  </head>
  <body>
    <div class="card">
      <img src="/assets/logo.jpeg" alt="Uzhavar Connect" class="logo" />
      <div><span class="badge">404 Error</span></div>
      <h1>Page Not Found</h1>
      <p>The agricultural page you were looking for doesn't exist or has moved.</p>
      <a href="/" class="btn">Return to Homepage</a>
    </div>
  </body>
</html>
